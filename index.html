<script src="shared/zd-config.js?v=20261112"></script>

<script>
/* =====================================================================
   ZD Licensing - firearms licence register and ID cards
   Screens: Register · Licence (details, photo, card, firearms, history)
            · Find by face · Backgrounds (Admin) · Staff (Admin) · Settings
   Roles come from the Staff list (HubRole): Admin, Officer, Viewer.
   The role only decides which screens open - SharePoint permissions on
   the lists (the OFFICE_GROUP) still decide who can read or change data.
   ===================================================================== */
const ROLES = ["Admin", "Officer", "Viewer"];
const S = { role: "", roleSource: "", route: "", param: "", filter: "all", q: "", dirty: false, card: null, offlinePass: false, missing: [], loadErr: null };
let D = { holders: [], licences: [], firearms: [], staff: [], backgrounds: [], at: "", offlineCopy: false };
const canEdit = () => S.role === "Admin" || S.role === "Officer";
const isAdmin = () => S.role === "Admin";
const SAMPLE_HOLDER = { GivenNames: "Sample", MiddleName: "James", Surname: "Holder", DateOfBirth: "1985-06-14", Sex: "M", Address: "Section 12, Allotment 4, Konedobu, National Capital District" };
const SAMPLE_LIC = { BarcodeNo: "GLCS2020-076240", Title: "12345678", LicenceType: "Individual", IssueDate: today(), ExpiryDate: addYears(today(), RULES.LICENCE_YEARS),
  SerialNo: "4471-22983-RB", Make: "Remington", FirearmType: "Shotgun", Calibre: "12 gauge", Purpose: "B" };
const arrFor = list => list === LISTS.holders ? D.holders : list === LISTS.licences ? D.licences : list === LISTS.firearms ? D.firearms : list === LISTS.staff ? D.staff : list === LISTS.codes ? D.codes : list === LISTS.docs ? D.docs : null;
const lic = ref => D.licences.find(l => l.ClientRef === ref);
const holder = ref => ref ? D.holders.find(h => h.ClientRef === ref) : null;
const firstNames = h => [h.GivenNames, h.MiddleName].map(v => String(v || "").trim()).filter(Boolean).join(" ");   // first + middle
const personName = l => [firstNames(l), String(l.Surname || "").toUpperCase()].filter(Boolean).join(" ");
/* Holders are an Individual or a Company. A company's own name is shown wherever the holder is named;
   its owner / CEO (the "representative") fills the person fields and the photo. */
const isCompany = h => h?.HolderKind === "Company";
const fullName = l => isCompany(l) && String(l.CompanyName || "").trim() ? String(l.CompanyName).trim() : personName(l);
/* Licence types: Individual (no prefix), Company firearm (C...), Licence to carry (LC...) */
const LTYPES = CHOICES.LICENCE_TYPES;
const typeOf = l => l?.LicenceType === "Company" || l?.LicenceType === "LTC" ? l.LicenceType : "Individual";
const prefixOf = t => LTYPES[t]?.prefix || "";
const isLTC = l => typeOf(l) === "LTC";
const carrierName = l => personName({ GivenNames: l?.CarrierGivenNames, MiddleName: l?.CarrierMiddleName, Surname: l?.CarrierSurname });
/* The licence number belongs to the holder (357 / 677). Each of their licences shows it,
   with C in front for a company's firearms; a licence to carry one of the owner's firearms shows LC + it. */
const cleanNo = v => String(v || "").toUpperCase().replace(/\s+/g, "").replace(/^(LTC|LC|C)(?=\d)/, "");
/* Licence numbers are written with a space after the letters, as on the cards: 23, C 23, LC 108 */
const withPfx = (pfx, no) => no ? (pfx ? `${pfx} ${no}` : no) : "";
const licNoFor = (h, t) => h?.LicenceNo ? withPfx(prefixOf(t), cleanNo(h.LicenceNo)) : "";
const noSpace = v => String(v || "").replace(/\s+/g, "");                 // so a search for "C23" still finds "C 23"
const ltcsOf = l => D.licences.filter(x => isLTC(x) && x.CarryForRef === l.ClientRef);
/* A face record is labelled with a holder's reference or a licence-to-carry's */
const refName = r => { const h = holder(r); if (h) return fullName(h); const l = D.licences.find(x => x.ClientRef === r);
  return l && isLTC(l) ? `${carrierName(l)} (LTC carrier, ${l.Title})` : r; };
const norm = s => String(s || "").trim().toUpperCase();
/* Firearm serial numbers must be unique. Compared without spaces, dashes, dots or slashes,
   so "K805021" and "k 805-021" are the same firearm. A licence to carry shares its company
   firearm's serial and is never counted. */
const serialKey = s => String(s || "").toUpperCase().replace(/[\s\-./]+/g, "");
function serialClash(serial, ref) {
  const k = serialKey(serial); if (!k) return {};
  const same = D.licences.filter(x => x.ClientRef !== ref && !isLTC(x) && serialKey(x.SerialNo) === k);
  return { live: same.find(x => x.LicenceStatus !== "Cancelled"), cancelled: same.find(x => x.LicenceStatus === "Cancelled") };
}
/* A person entering the serial of someone else's firearm (a company's or another person's)
   most likely carries it: offer the owner's licence to carry instead, with the person and the
   firearm filled in. A licence to carry is numbered LC + the OWNER's number (C44 -> LC44, 23 -> LC23). */
const carryOffer = (person, x) => { const o = x && !isLTC(x) && holder(x.HolderRef);   // the firearm's owner - a company or another person
  return o && person && !isCompany(person) && o.ClientRef !== person.ClientRef ? o : null; };
function goCarry(person, x) {
  S.carry = { co: x.HolderRef, person: person.ClientRef, gun: x.ClientRef };
  S.dirty = false; location.hash = `#/newlicence/${encodeURIComponent(x.HolderRef)}/LTC`;
}
const clashText = x => `licence ${x.Title || "(no number)"} - ${fullName(holder(x.HolderRef) || {})}${x.Make || x.FirearmType ? " (" + [x.Make, x.FirearmType].filter(Boolean).join(" ") + ")" : ""}`;

/* ---------------- start ---------------- */
(async function start() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(e => console.warn("offline support unavailable", e));
  try { await initAuth(); }
  catch (e) { return fatal("Microsoft sign-in couldn't start: " + e.message); }
  if (!DEMO && !account) return renderSignIn();
  SYNC.onChange = renderWho;
  await loadData();
  if (S.loadErr && !D.at) return fatal(isForbidden(S.loadErr)
    ? `You don't have access to the ${esc(BRAND.SHORT)} licensing site. Ask an administrator to add you to the <b>${esc(BRAND.OFFICE_GROUP)}</b> group.`
    : "Couldn't load from SharePoint: " + esc(S.loadErr.message));
  resolveRole();
  if (S.role === "None") return fatal(`You're signed in as <b>${esc(me())}</b>, but you're not on the ${esc(BRAND.SHORT)} staff list. Ask an administrator to add you under <b>Staff</b>.`, true);
  if (!(await faceGate())) return;
  S.mobile = mobileView();
  document.body.classList.toggle("mobile", S.mobile);
  $("#hdr").hidden = false;
  window.addEventListener("hashchange", () => route());   // not route(event): the event would count as "quiet" and skip the unsaved-changes question
  await convertOldRecords();
  // the mobile view always opens on an empty search, whatever page the address (or a bookmark) pointed at
  if (S.mobile) { history.replaceState(null, "", location.pathname + location.search + "#/"); S.mq = ""; }
  route();
  flushSoon(800);
})();

function fatal(html, withSignOut) {
  $("#main").innerHTML = `<div class="card signin"><h1>${esc(BRAND.COMPANY)} Licensing</h1><p>${html}</p>
    ${withSignOut || !DEMO ? `<button class="btn" id="so">Sign out</button>` : ""}</div>`;
  const b = $("#so"); if (b) b.onclick = signOut;
}
function renderSignIn() {
  $("#main").innerHTML = `<div class="card signin"><h1>${esc(BRAND.COMPANY)} Licensing</h1>
    <p class="muted">Firearms licence register and ID cards</p>
    <p><button class="btn primary" id="si">Sign in with Microsoft</button></p>
    <p class="small muted">After signing in you'll be asked for a quick face check.</p></div>`;
  $("#si").onclick = signIn;
}

/* ---------------- data: SharePoint, or the copy saved on this device ---------------- */
async function loadData() {
  S.missing = []; S.loadErr = null;
  const soft = (p, name) => p.catch(e => { if (!isNetErr(e) && isMissingList(e)) { S.missing.push(name); return []; } throw e; });
  try {
    if (!online()) throw Object.assign(new Error("offline"), { kind: "offline" });
    if (!DEMO) await getSite();
    const [holders, licences, firearms, staff, backgrounds, codes, docs] = await Promise.all([
      soft(listItems(LISTS.holders), LISTS.holders), soft(listItems(LISTS.licences), LISTS.licences), listItems(LISTS.firearms).catch(() => []),
      soft(listItems(LISTS.staff), LISTS.staff), soft(libraryFiles(LISTS.backgrounds), LISTS.backgrounds), soft(listItems(LISTS.codes), LISTS.codes),
      soft(libraryFiles(LISTS.docs), LISTS.docs)]);
    D = { holders, licences, firearms, staff, backgrounds, codes, docs, at: new Date().toISOString(), offlineCopy: false };
    await saveSnapshot();
    cacheBackgrounds();
  } catch (e) {
    if (!isNetErr(e)) S.loadErr = e;
    const snap = await kvGet("snap").catch(() => null);
    if (snap && (isNetErr(e) || !isForbidden(e))) D = { holders: [], firearms: [], codes: [], docs: [], ...snap, offlineCopy: true };
  }
  await applyQueue();
}
const saveSnapshot = () => kvSet("snap", {
  holders: D.holders.filter(h => !String(h.id).startsWith("local-")).map(clean),
  licences: D.licences.filter(l => !l._pending || !String(l.id).startsWith("local-")).map(clean),
  firearms: D.firearms.filter(f => !String(f.id).startsWith("local-")).map(clean),
  staff: D.staff.map(clean), codes: (D.codes || []).filter(c => !String(c.id).startsWith("local-")).map(clean),
  docs: (D.docs || []).filter(d => !String(d.id).startsWith("local-")).map(clean), backgrounds: D.backgrounds, at: D.at }).catch(() => {});
const clean = r => Object.fromEntries(Object.entries(r).filter(([k]) => !k.startsWith("_")));

/* Put changes still waiting in the queue on screen, marked "waiting to send". */
function mergeLocal(list, ref, fields, extra = {}) {
  const arr = arrFor(list); if (!arr) return null;
  const oldRef = ref; ref = fields.ClientRef || ref;   // a converted row is shown under its new reference
  let row = arr.find(r => r.ClientRef === ref) || arr.find(r => r.ClientRef === oldRef);
  if (row) Object.assign(row, fields, extra, { _pending: true });
  else { row = { id: "local-" + ref, ...fields, ClientRef: ref, ...extra, _pending: true }; arr.push(row); }
  return row;
}
async function applyQueue(onlyRef) {
  for (const op of await qMine()) {
    if (onlyRef && op.ref !== onlyRef) continue;
    if (op.kind === "upsert") mergeLocal(op.list, op.ref, op.fields, op.file ? { _localKey: op.file.localKey } : {});
    if (op.kind === "face") mergeLocal(op.list || LISTS.holders, op.ref, { FaceStatus: "Waiting" });
    if (op.kind === "doc") mergeLocal(LISTS.docs, op.ref, op.fields, op.file ? { name: op.file.name, size: op.file.blob?.size } : {});
  }
  await qCount();
}
SENT_HOOKS.push(async (op, saved) => {
  const arr = arrFor(op.kind === "face" ? op.list || LISTS.holders : op.list); if (!arr) return;   // a face op returns the updated holder (or LTC)
  // (a converted licence is found by its old ref and comes back with its new one)
  const newRef_ = saved.ClientRef || op.ref;
  const i = arr.findIndex(r => r.ClientRef === op.ref || r.ClientRef === newRef_);
  // a document's details-only change comes back without its file details, so keep those
  const row = op.kind === "doc" && i >= 0 ? { ...arr[i], ...saved } : { ...saved };
  delete row._pending;
  if (i >= 0) arr[i] = row; else arr.push(row);
  if (op.file?.localKey) await kvDel(op.file.localKey).catch(() => {});
  await applyQueue(op.ref);                                          // anything still waiting for the same row
  saveSnapshot();
  if (!$("#dlg").open && !$("#ask").open && $("#camOv").hidden && $("#cropOv").hidden) route(true);
});
/* Download every background once so cards can be printed offline. */
async function cacheBackgrounds() {
  for (const b of D.backgrounds) {
    try { if (!(await kvGet("bg:" + b.fileId))) await kvSet("bg:" + b.fileId, await downloadFile(LISTS.backgrounds, b.fileId)); } catch (e) { if (isNetErr(e)) return; }
  }
}
const IMGS = {};
async function bgImage(b) {
  if (!b) return null;
  if (IMGS["bg:" + b.fileId]) return IMGS["bg:" + b.fileId];
  let blob = await kvGet("bg:" + b.fileId);
  if (!blob && online()) { try { blob = await downloadFile(LISTS.backgrounds, b.fileId); await kvSet("bg:" + b.fileId, blob); } catch {} }
  // kept (not revoked): the background picker re-uses this picture's address for its thumbnails
  return blob ? (IMGS["bg:" + b.fileId] = await loadImage(URL.createObjectURL(blob))) : null;
}
/* Photos belong to the holder */
async function photoBlob(l) {
  if (!l) return null;
  if (l._localKey) { const b = await kvGet(l._localKey); if (b) return b; }
  if (!l.PhotoItemId) return null;
  let b = await kvGet("photo:" + l.PhotoItemId);
  if (!b && online()) { try { b = await downloadFile(LISTS.photos, l.PhotoItemId); await kvSet("photo:" + l.PhotoItemId, b); } catch {} }
  return b || null;
}
const URLS = {};
async function photoUrl(l) {
  const key = l._localKey || l.PhotoItemId; if (!key) return "";
  if (URLS[key]) return URLS[key];
  const b = await photoBlob(l); return b ? (URLS[key] = URL.createObjectURL(b)) : "";
}

/* ---------------- roles ---------------- */
function resolveRole() {
  if (DEMO) { const r = new URLSearchParams(location.search).get("role"); S.role = ROLES.includes(r) ? r : "Admin"; S.roleSource = "demo"; return; }
  const mine = D.staff.find(s => String(s.Email || "").trim().toLowerCase() === me() && s.StaffStatus !== "Left");
  if (mine && ROLES.includes(mine.HubRole)) { S.role = mine.HubRole; S.roleSource = "staff"; return; }
  // First run: nobody is an Admin yet, so whoever signs in can set things up
  if (!D.staff.some(s => s.HubRole === "Admin" && s.StaffStatus !== "Left")) { S.role = "Admin"; S.roleSource = "setup"; return; }
  S.role = "None";
}

/* =====================================================================
   FACE CHECK AT SIGN-IN (mandatory)
   First time: the photo becomes the person's face record.
   Every sign-in after that: the face must match the signed-in person.
   With no internet: allowed only if this device passed a face check for
   this person within OFFLINE_GRACE_HOURS (zd-config.js).
   ===================================================================== */
async function faceGate() {
  const st = facePassState();
  if (st === "ok") return true;
  if (st === "offline") { S.offlinePass = true; return true; }
  if (!DEMO && !FACE_API) { fatal("The face check service isn't set up yet, so nobody can sign in. An administrator needs to put its address in <code>ZD_FACE_API</code> (shared/zd-config.js).", true); return false; }
  if (!online()) {
    fatal(`No internet connection. The face check at sign-in needs internet, and this device hasn't passed one for you in the last ${RULES.OFFLINE_GRACE_HOURS} hours.<br><br><button class="btn primary" onclick="location.reload()">Try again</button>`, true);
    return false;
  }
  let status;
  try { status = await faceCall({ action: "status" }); }
  catch (e) { fatal("The face check service couldn't be reached: " + esc(e.message) + `<br><br><button class="btn primary" onclick="location.reload()">Try again</button>`, true); return false; }
  S.faceAdmin = !!status.admin;
  let enrolled = !!status.enrolled;
  $("#main").innerHTML = "";
  const note = await openCamera({
    title: enrolled ? "Face check" : "Set up your face check",
    sub: enrolled ? "Look at the camera, face inside the oval." :
      "First time only: this photo becomes your face record for signing in. Only a face-recognition record is kept, not the photo. Make sure only you are in the picture.",
    take: enrolled ? "Check my face" : "Take photo & set up", selfie: true, guide: "oval", prefKey: "zd-cam-face", cancel: "Sign out",
    onShot: async (blob, msg) => {
      const image = await blobToB64(await shrink(blob, 900));
      if (!enrolled) {
        msg("Setting up your face…", true);
        try { await faceCall({ action: "enrol", image }); }
        catch (e) { if (e.code === "ALREADY_ENROLLED") { enrolled = true; msg("Your face is already set up - take the photo again to check it."); return false; } throw e; }
        return "face set up";
      }
      msg("Checking…", true);
      const r = await faceCall({ action: "verify", image });
      if (r.verified) return `verified ${r.similarity}%`;
      msg("That didn't match your face record. Try again in better light, or ask an administrator to reset your face record.");
      return false;
    }
  });
  if (!note) { signOut(); return false; }
  setFacePass(note);
  logActivity("Signed in", null, null, "Face check: " + note);
  return true;
}

/* ---------------- camera ---------------- */
let camStream = null;
function stopCam() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
async function startCam(deviceId, selfie) {
  stopCam();
  const want = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: selfie ? "user" : "environment" };
  camStream = await navigator.mediaDevices.getUserMedia({ video: { ...want, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
  const v = $("#camVid"); v.srcObject = camStream; await v.play().catch(() => {});
}
async function fillCameraList(prefKey) {
  const sel = $("#camSel");
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const cur = camStream?.getVideoTracks()[0]?.getSettings().deviceId || "";
  sel.innerHTML = cams.map((c, i) => `<option value="${esc(c.deviceId)}" ${c.deviceId === cur ? "selected" : ""}>${esc(c.label || "Camera " + (i + 1))}</option>`).join("");
  sel.hidden = cams.length < 2;
}
function grabFrame() {
  const v = $("#camVid");
  if (!v.videoWidth) throw new Error("The camera isn't ready yet - try again in a moment.");
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
}
async function shrink(blob, max) {
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
}
/* Opens the camera; onShot(blob, msg) returns a value to finish with, or false to stay open. */
function openCamera({ title, sub, take = "Take photo", selfie = false, guide = "", allowFile = false, prefKey = "zd-cam", cancel = "Cancel", onShot }) {
  return new Promise(resolve => {
    const ov = $("#camOv"), msgEl = $("#camMsg"), takeBtn = $("#camTake"), sel = $("#camSel"), file = $("#camFile");
    $("#camT").textContent = title; $("#camS").textContent = sub || "";
    $("#camBox").className = "cam" + (selfie ? " selfie" : "");
    $("#camGuide").innerHTML = guide === "oval" ? `<div class="oval"></div>` : guide === "frame" ? `<div class="frame34"></div>` : "";
    takeBtn.textContent = take; $("#camCancel").textContent = cancel; $("#camFileLbl").hidden = !allowFile;
    const msg = (t, ok) => { msgEl.textContent = t || ""; msgEl.classList.toggle("ok", !!ok); };
    msg(""); ov.hidden = false;
    const finish = v => { stopCam(); ov.hidden = true; takeBtn.onclick = sel.onchange = file.onchange = $("#camCancel").onclick = null; resolve(v); };
    const handle = async blob => {
      takeBtn.disabled = true;
      try { const r = await onShot(blob, msg); if (r !== false && r !== undefined) finish(r); }
      catch (e) { msg(isNetErr(e) ? "No internet connection - try again when you're back online." : e.message); }
      finally { takeBtn.disabled = false; }
    };
    const start = async id => {
      try { await startCam(id, selfie); await fillCameraList(prefKey); msg(""); }
      catch (e) {
        if (id) { localStorage.removeItem(prefKey); return start(""); }   // saved camera unplugged: use the default
        msg("Camera unavailable: " + e.message + "." + (allowFile ? " You can load a photo from a file instead." : " Allow camera access for this site, then try again."));
      }
    };
    sel.onchange = () => { localStorage.setItem(prefKey, sel.value); start(sel.value); };
    takeBtn.onclick = async () => { try { await handle(await grabFrame()); } catch (e) { msg(e.message); } };
    file.onchange = () => { const f = file.files[0]; file.value = ""; if (f) handle(f); };
    $("#camCancel").onclick = () => finish(null);
    start(localStorage.getItem(prefKey) || "");
  });
}

/* ---------------- crop to a 3 x 4 passport-style photo ---------------- */
function openCrop(blob) {
  return new Promise(async resolve => {
    let bmp;
    try { bmp = await createImageBitmap(blob); } catch { toast("That file isn't a photo this browser can read"); return resolve(null); }
    let src = document.createElement("canvas");
    const draw0 = () => { src.width = bmp.width; src.height = bmp.height; src.getContext("2d").drawImage(bmp, 0, 0); };
    draw0();
    const ov = $("#cropOv"), cv = $("#cropCv"), zoomEl = $("#cropZoom"), VW = 300, VH = 400, dpr = window.devicePixelRatio || 1;
    cv.width = VW * dpr; cv.height = VH * dpr; cv.style.width = VW + "px"; cv.style.height = VH + "px";
    let z = 1, cx, cy;
    const base = () => Math.max(VW / src.width, VH / src.height);
    const clamp = () => {
      const sc = base() * z, vw = VW / sc, vh = VH / sc;
      cx = Math.min(Math.max(cx, vw / 2), src.width - vw / 2); cy = Math.min(Math.max(cy, vh / 2), src.height - vh / 2);
      return { sc, vw, vh };
    };
    const reset = () => { z = 1; zoomEl.value = 1; cx = src.width / 2; cy = src.height / 2; paint(); };
    const paint = () => {
      const { vw, vh } = clamp(), g = cv.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(src, cx - vw / 2, cy - vh / 2, vw, vh, 0, 0, cv.width, cv.height);

      g.beginPath(); g.ellipse(cv.width / 2, cv.height * .42, cv.width * .3, cv.height * .27, 0, 0, Math.PI * 2); g.stroke();
    };
    let drag = null;
    cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!drag) return; const sc = base() * z; cx -= (e.clientX - drag.x) / sc; cy -= (e.clientY - drag.y) / sc; drag = { x: e.clientX, y: e.clientY }; paint(); };
    cv.onpointerup = () => drag = null;
    cv.onwheel = e => { e.preventDefault(); z = Math.min(4, Math.max(1, z * (e.deltaY < 0 ? 1.08 : 1 / 1.08))); zoomEl.value = z; paint(); };
    zoomEl.oninput = () => { z = +zoomEl.value; paint(); };
    $("#cropRot").onclick = () => {
      const r = document.createElement("canvas"); r.width = src.height; r.height = src.width;
      const g = r.getContext("2d"); g.translate(r.width, 0); g.rotate(Math.PI / 2); g.drawImage(src, 0, 0); src = r; reset();
    };
    const done = v => { ov.hidden = true; resolve(v); };
    $("#cropOk").onclick = () => {
      const { vw, vh } = clamp(), out = document.createElement("canvas"); out.width = 900; out.height = 1200;
      const g = out.getContext("2d"); g.imageSmoothingQuality = "high";

}

        <div class="card"><div class="bar"><h3 style="margin:0">${co ? "Company firearms (C licences)" : "Licensed firearms"}</h3><span class="grow"></span>

          ${isNew ? `<p class="muted small">Save the holder first, then add their firearms - each gets its own licence number.</p>` : guns.length ? `<table><thead><tr><th>Lic No</th><th>Firearm</th><th>Class</th><th>Purpose</th><th>Expires</th><th>Status</th><th>Printed</th></tr></thead><tbody>
            ${guns.map(l => `<tr class="go" data-l="${esc(l.ClientRef)}"><td class="mono"><b>${esc(l.Title)}</b></td><td>${esc(gunText(l))}</td><td title="${esc(className(l.Class))}">${esc(l.Class)}</td><td title="${esc(purposeNames(l.Purpose))}">${esc(l.Purpose)}</td>
              <td>${fmtDate(l.ExpiryDate)}</td><td><span class="tag ${STATUS_TAG[statusOf(l)] || ""}">${statusOf(l)}</span>${l._pending ? ` <span class="tag info">waiting</span>` : ""}</td><td>${l.LastPrinted ? fmtDate(l.LastPrinted) : "—"}</td></tr>`).join("")}</tbody></table>`
            : `<p class="muted small">No licensed firearms yet.</p>`}</div>
        ${!isNew && (co || guns.length || ltcs.length) ? `<div class="card"><div class="bar"><h3 style="margin:0">Licences to carry ${co ? "the company's" : "these"} firearms</h3><span class="grow"></span>
            ${!ro ? guns.length ? `<a class="btn primary sm" href="#/newlicence/${encodeURIComponent(ref)}/LTC">+ Add licence to carry</a>` : `<span class="small muted">Add a firearm first</span>` : ""}</div>
          ${ltcs.length ? `<table><thead><tr><th></th><th>LC No</th><th>Carrier</th><th>Firearm</th><th>Purpose</th><th>Expires</th></tr></thead><tbody>${ltcs.map(ltcRow).join("")}</tbody></table>`
            : `<p class="muted small">No licences to carry yet. Each person who carries one of ${co ? "the company's" : "this holder's"} firearms gets a licence to carry it, numbered LC + their own licence number (e.g. LC108), with their photo and details.</p>`}</div>` : ""}
        ${!isNew ? `<div class="card"><h3>History</h3><div id="hist" class="small muted">${online() ? "Loading…" : "History shows when you're online."}</div></div>` : ""}

        <div class="card"><h3 id="photoHead">${co ? "Owner / CEO photo" : "Photo"}</h3><div class="photo-box">
          <div id="photoSlot"><div class="nophoto">No photo</div></div>
          <div style="flex:1;min-width:180px">
            ${ro ? "" : `<button class="btn primary" id="photoBtn">${h.PhotoItemId || h._localKey ? "Retake photo" : "Take photo"}</button>
              <label class="chk" style="margin-top:10px"><input type="checkbox" id="faceOpt" checked> Register the face for face recognition</label>
              <p class="small muted">The face record lets you find this person from a photo later, and warns if the same face is already on file under another name.</p>
              ${!isNew && (h.PhotoItemId || h._localKey) && !["Enrolled", "Waiting", "Check"].includes(h.FaceStatus) ? `<button class="btn sm" id="faceNow">Register face from this photo</button>` : ""}`}

            ${isAdmin() && orphanFaces(h).length ? `<button class="btn sm" id="clearOrphan" title="The matching face belongs to a holder who has been deleted">Clear - the other face belongs to a deleted holder</button>` : ""}

          </div></div></div>
        ${docsCard(h, null, isNew)}
      </div>
    </div>`;
  const form = $("#mainForm");
  form.oninput = markDirty;
  if (!isNew) wireDocs(h, null);
  fillThumbs();
  // Individual / Company: show that kind's fields. Phone, Email and Address appear in both layouts, so only the visible copy is read.
  const kindNow = () => form.querySelector('[name="HolderKind"]:checked')?.value || form.querySelector('input[type=hidden][name="HolderKind"]')?.value || "Individual";
  const noHint = () => {
    const n = cleanNo(form.elements.LicenceNo.value), c = kindNow() === "Company";
    $("#noHint").innerHTML = !n ? "Shown on every one of this holder's licences. Needed before firearms can be added."
      : c ? `Company firearms: <b class="mono">C ${esc(n)}</b>` : `Every licensed firearm: <b class="mono">${esc(n)}</b> · Licences to carry someone else's firearm: <b class="mono">LC ${esc(n)}</b>`;
  };
  form.elements.LicenceNo.addEventListener("input", noHint); noHint();
  form.querySelectorAll('[name="HolderKind"]').forEach(r => r.onchange = () => {
    const c = kindNow() === "Company"; form.classList.toggle("kind-company", c);
    $("#photoHead").textContent = c ? "Owner / CEO photo" : "Photo"; noHint();
  });
  const val = () => {
    const f = { HolderKind: kindNow() };
    for (const el of form.elements) {
      if (!el.name || el.name === "HolderKind" || el.closest(form.classList.contains("kind-company") ? ".ind-only" : ".co-only")) continue;
      f[el.name] = String(el.value).trim();
    }
    if (f.HolderKind !== "Company") Object.assign(f, { CompanyName: "", CompanyRegNo: "", RepRole: "" });
    return f;
  };
  const showPhoto = async () => {
    const u = DRAFT_PHOTO ? URL.createObjectURL(DRAFT_PHOTO) : await photoUrl(h);
    if (u) $("#photoSlot").innerHTML = `<img src="${u}" alt="Licence holder">`;
  };
  showPhoto();
  const photoBtn = $("#photoBtn");
  if (photoBtn) photoBtn.onclick = async () => {
    const blob = await takeLicencePhoto(); if (!blob) return;
    const withFace = $("#faceOpt").checked;
    if (isNew) { DRAFT_PHOTO = blob; markDirty(); S.draftFace = withFace; showPhoto(); return; }
    await queuePhoto(h, blob, withFace); toast("Photo saved" + (online() ? "" : " on this device - it will be sent when you're online"));
    route(true);
  };
  const faceNow = $("#faceNow");
  if (faceNow) faceNow.onclick = async () => {
    const b = await photoBlob(h); if (!b) return toast("The photo isn't available on this device");
    await enqueue({ kind: "face", ref, file: { blob: b }, label: `Face record · ${fullName(h)}` });
    mergeLocal(LISTS.holders, ref, { FaceStatus: "Waiting" }); route(true);
  };
  $$("tr[data-l]").forEach(tr => tr.onclick = () => location.hash = "#/licence/" + encodeURIComponent(tr.dataset.l));
  const saveBtn = $("#saveBtn");
  if (saveBtn) saveBtn.onclick = async () => {
    const f = val();
    const comp = f.HolderKind === "Company";
    const need = comp ? [["CompanyName", "Company name"], ["Surname", "Owner / CEO surname"], ["GivenNames", "Owner / CEO first name"]]
      : [["Surname", "Surname"], ["GivenNames", "First name"]];   // date of birth is optional
    const missing = need.filter(([k]) => !f[k]).map(x => x[1]);
    if (missing.length) return toast("Please fill in: " + missing.join(", "));
    const twin = comp
      ? D.holders.find(x => x.ClientRef !== ref && isCompany(x) && (norm(x.CompanyName) === norm(f.CompanyName) || (f.CompanyRegNo && norm(x.CompanyRegNo) === norm(f.CompanyRegNo))))
      : D.holders.find(x => x.ClientRef !== ref && !isCompany(x) && norm(x.Surname) === norm(f.Surname) && norm(firstNames(x)) === norm(firstNames(f)));   // dates of birth are rarely known
    if (twin && await ask(comp ? `${fullName(twin)}${twin.CompanyRegNo ? " (IPA " + twin.CompanyRegNo + ")" : ""} is already a licence holder.\n\nOpen that company rather than creating a second record?`
        : `${fullName(twin)}${twin.DateOfBirth ? ", born " + fmtDate(twin.DateOfBirth) + "," : ""} is already a licence holder.\n\nOpen that person to add another firearm, rather than creating a second record?`,
        { title: "Already a holder", yes: comp ? "Open that company" : "Open that person", no: "Save as a new holder" })) {
      S.dirty = false; location.hash = "#/holder/" + encodeURIComponent(twin.ClientRef); return; }
    if (isNew) f.CapturedBy = me();
    f.LicenceNo = cleanNo(f.LicenceNo);
    if (f.LicenceNo) {                                   // each number belongs to one holder only
      const other = D.holders.find(x => x.ClientRef !== ref && cleanNo(x.LicenceNo) === f.LicenceNo);
      if (other) return toast(`Licence no ${f.LicenceNo} already belongs to ${fullName(other)}`);
    }
    const oldNo = cleanNo(h.LicenceNo);
    f.Title = fullName(f);
    saveBtn.disabled = true;
    mergeLocal(LISTS.holders, ref, f);
    await enqueue({ kind: "upsert", list: LISTS.holders, ref, fields: f, label: `${isNew ? "New holder" : "Holder changes"} · ${f.Title}` });
    const saved = holder(ref);
    logActivity(isNew ? "Holder added" : "Holder updated", saved, null);
    if (f.LicenceNo) {                                   // their firearms follow the holder's number (357, C677) and so do
      // the licences to carry they hold for other owners' firearms (LC + their own number, e.g. LC108)
      for (const x of D.licences.filter(x => (x.HolderRef === ref && !isLTC(x)) || (isLTC(x) && x.CarrierRef === ref))) {
        const no = isLTC(x) ? withPfx("LC", f.LicenceNo) : licNoFor(saved, typeOf(x));
        if (x.Title === no) continue;
        const was = x.Title;
        mergeLocal(LISTS.licences, x.ClientRef, { Title: no });
        await enqueue({ kind: "upsert", list: LISTS.licences, ref: x.ClientRef, fields: { Title: no }, label: `Licence no ${was} → ${no}` });
        logActivity("Licence number changed", saved, lic(x.ClientRef), `${was || "—"} → ${no}`);
      }
    }
    if (!isNew && oldNo !== f.LicenceNo) logActivity("Holder licence number changed", saved, null, `${oldNo || "—"} → ${f.LicenceNo || "—"}`);
    if (isNew && DRAFT_PHOTO) { await queuePhoto(saved, DRAFT_PHOTO, S.draftFace !== false); DRAFT_PHOTO = null; }
    S.dirty = false; S.newRef = null;
    toast(online() ? "Saved" : "Saved on this device - it will be sent when you're online");
    if (isNew) location.hash = "#/holder/" + encodeURIComponent(ref); else route(true);
  };
  const clearOrphan = $("#clearOrphan");
  if (clearOrphan) clearOrphan.onclick = async () => {
    if (!online()) return toast("Needs an internet connection");
    try {
      for (const r of orphanFaces(h)) await faceCall({ action: "licenseeRemove", ref: r });
      const f = { FaceStatus: "Enrolled", FaceNote: "" };
      mergeLocal(LISTS.holders, ref, f);
      await enqueue({ kind: "upsert", list: LISTS.holders, ref, fields: f, label: `Face check cleared · ${fullName(h)}` });
      logActivity("Face check cleared", h, null, "matching face belonged to a deleted holder");
      toast("Cleared"); route(true);
    } catch (e) { toast(e.status === 403 ? "Only face-service administrators can do this" : e.message); }
  };
  const delHolder = $("#delHolder");
  if (delHolder) delHolder.onclick = async () => {
    if (!online()) return toast("Deleting needs an internet connection");
    if (docsFor(h).length) return toast("Delete this holder's documents first");
    if (!await ask(`Delete licence holder ${fullName(h)}?\n\nThey have no licensed firearms. The record is removed from the register for good.`, { title: "Delete holder", yes: "Delete", danger: true })) return;
    try {
      if (!String(h.id).startsWith("local-")) await deleteItem(LISTS.holders, h.id);
      // their face record in AWS goes too, so it can't be mistaken for someone else later
      if (!D.holders.some(x => x !== h && x.ClientRef === ref)) await faceCall({ action: "licenseeRemove", ref }).catch(e => console.warn("face record not removed", e));
      for (const op of (await qMine()).filter(o => (o.list === LISTS.holders || o.kind === "face") && o.ref === ref)) await qDel(op.qid);
      await qCount();
      D.holders = D.holders.filter(x => x !== h); saveSnapshot();
      logActivity("Holder deleted", h, null);
      S.dirty = false; toast("Holder deleted"); location.hash = "#/";
    } catch (e) { toast(isForbidden(e) ? "SharePoint refused this (no permission)" : e.message); }
  };
  if (!isNew && online()) loadHistory("HolderRef", ref);
}

  const form = $("#mainForm");

  const cv = $("#cardCv");

    $$("img[data-bgimg]").forEach(async img => { const im = await bgImage(D.backgrounds.find(b => b.fileId === img.dataset.bgimg)); if (im) img.src = im.src; });
    $$("[data-bg]").forEach(b => b.onclick = () => {
      const k = b.dataset.bg, meta = D.backgrounds.find(x => x.fileId === k);
      S.card = meta ? { ref, bg: k, orientation: meta.Orientation || "Landscape" } : { ref, bg: "", orientation: k.split("-")[1] };

  $("#pngBtn").onclick = async () => {

    if (!["Active", "Expiring"].includes(statusOf(l)) && !await ask(`This licence is ${statusOf(l)}. Print a card anyway?`, { title: "Print card", yes: "Print anyway" })) return;
    const hasPhoto = ltc ? l.PhotoItemId || l._localKey : h.PhotoItemId || h._localKey;
    if (!hasPhoto && !await ask(`${ltc ? "The person licensed to carry" : isCompany(h) ? "The owner / CEO" : "The holder"} has no photo. Print the card without one?`, { title: "No photo", yes: "Print without photo" })) return;
    const { sides, c } = await printCanvas();

    try { ZDCard.printCard(sides, printSettings()); }
    catch (e) { return toast(e.message); }

    await enqueue({ kind: "upsert", list: LISTS.licences, ref, fields, label: `Card printed · ${l.Title}` });

    const need = ltc ? [["Title", "Carrier's licence no"], ["CarrierSurname", "Surname"], ["CarrierGivenNames", "First name"], ["CarryForRef", "Firearm"], ["Purpose", "Purpose"], ["IssueDate", "Issued"], ["ExpiryDate", "Expires"]]

    if (ltc && !isNew && pickedPhoto) { await queuePhoto(lic(ref), pickedPhoto, false, LISTS.licences); pickedPhoto = null; }
    if (!ltc && !isNew) {                                  // keep the licences to carry this firearm in step with it
      const gf = { SerialNo: f.SerialNo || "", Make: f.Make || "", Model: f.Model || "", FirearmType: f.FirearmType || "", Calibre: f.Calibre || "", Class: f.Class || "" };
      for (const x of ltcsOf(l)) {

/* Code lists - Class, Purpose and Type. Stored (and, for Purpose and Type, printed) as the
   code ("B", "REV"), shown with its meaning ("B - Self Protection"). Admins keep them in the
   ZD_Codes list (Codes page); until a set has rows there the starting list in zd-config.js is used. */
const CODE_SETS = [["Class", "Class codes", "Kept on the record, not printed."],
  ["Purpose", "Purpose codes", "The letter is printed on the front of the card."],
  ["Type", "Firearm type codes", "Printed in the card's Type box."],
  ["DocType", "Document types", "Offered when a document is attached.", { free: true }]];
const DEFAULT_CODES = { Class: CHOICES.CLASSES, Purpose: CHOICES.PURPOSES, Type: CHOICES.TYPES, DocType: CHOICES.DOC_TYPES };
const codeSetOpts = set => (CODE_SETS.find(c => c[0] === set) || [])[3] || {};
const pairs = arr => (arr || []).map(p => Array.isArray(p) ? p : [p, p]);
const savedCodes = set => (D.codes || []).filter(c => c.CodeSet === set);
const codeSort = (a, b) => (Number(a.SortOrder) || 9999) - (Number(b.SortOrder) || 9999) || String(a.Title).localeCompare(String(b.Title));
const isActive = c => c.Active !== "No" && c.Active !== false;
function codeList(set) {
  const rows = savedCodes(set);
  if (!rows.length) return pairs(DEFAULT_CODES[set]);
  return rows.filter(isActive).sort(codeSort).map(c => [String(c.Title), String(c.Description || c.Title)]);
}
const codeName = (set, code) => { const r = savedCodes(set).find(c => c.Title === code); return r ? String(r.Description || "") : ((pairs(DEFAULT_CODES[set]).find(p => p[0] === code) || [])[1] || ""); };
const purposeName = code => codeName("Purpose", code);
const className = code => codeName("Class", code);
const typeName = code => codeName("Type", code);
function codeOptions(list, cur) {
  const known = list.some(p => p[0] === cur);
  return `<option value="">-</option>` + list.map(([c, n]) => `<option value="${esc(c)}" ${c === cur ? "selected" : ""}>${esc(!n || c === n ? c : c + " - " + n)}</option>`).join("")
    + (cur && !known ? `<option value="${esc(cur)}" selected>${esc(cur)} (old value - please choose)</option>` : "");
}
const purposeOptions = cur => codeOptions(codeList("Purpose"), cur);
/* A licence can have several purposes. They are stored as the letters printed on the card,
   in code-list order ("BEFG"), so a single letter ("B") reads exactly as before. */
function purposeCodes(v) {
  const t = String(v || "").toUpperCase().replace(/[\s,;/]+/g, "");
  const known = [...new Set([...codeList("Purpose"), ...pairs(DEFAULT_CODES.Purpose)].map(p => String(p[0]).toUpperCase()))].sort((a, b) => b.length - a.length);
  const out = []; let i = 0;
  while (i < t.length) { const k = known.find(c => c && t.startsWith(c, i)) || t[i]; out.push(k); i += k.length; }
  return [...new Set(out)];
}
const purposeOrder = codes => { const order = codeList("Purpose").map(p => String(p[0]).toUpperCase());
  return [...codes].sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99) || a.localeCompare(b)); };
const purposeNames = v => purposeCodes(v).map(c => `${c} - ${purposeName(c) || "?"}`).join("\n");
function purposePicker(cur, dis) {
  const sel = purposeCodes(cur), list = codeList("Purpose");
  const extra = sel.filter(c => !list.some(p => String(p[0]).toUpperCase() === c));     // an old code no longer in the list
  return `<fieldset class="purposes" ${dis}><legend>Purpose * <span class="muted small">(tick all that apply - the letters print together, e.g. BEFG)</span></legend>
    ${list.map(([c, n]) => `<label class="chk"><input type="checkbox" name="PurposeCode" value="${esc(c)}" ${sel.includes(String(c).toUpperCase()) ? "checked" : ""}> <b class="mono">${esc(c)}</b> ${esc(n)}</label>`).join("")}
    ${extra.map(c => `<label class="chk"><input type="checkbox" name="PurposeCode" value="${esc(c)}" checked> <b class="mono">${esc(c)}</b> <span class="muted">(no longer in the list)</span></label>`).join("")}</fieldset>`;
}
/* The Registrar's signature: a picture in the backgrounds library with Layout "Registrar signature" */
const sigMeta = () => D.backgrounds.find(b => ZDCard.LAYOUTS[b.Layout]?.isSignature && b.Active !== "No" && b.Active !== false);
/* Background settings from its library columns */
async function bgFor(b, orientation = "Landscape") {
  if (!b) return { image: null, orientation, textColour: "Dark", showHeader: true };

    showHeader: b.ShowHeader !== "No" && b.ShowHeader !== false, panel: b.TextPanel === "Yes",
    layout: b.Layout && b.Layout !== "Standard" ? b.Layout : "", preprinted: b.Preprinted === "Yes",
    signature: await bgImage(sigMeta()) };
}
/* Holder + licence -> the field names the card layouts use */
function cardData(h, l) {
  const d = { ...h, ...l, GivenNames: firstNames(h), LicenceNo: l.Title, BarcodeNo: String(l.BarcodeNo || "").trim() || noSpace(l.Title), Registrar: BRAND.REGISTRAR || "" };   // middle name prints after the first name
  const co = String(h.CompanyName || "").trim();
  d.LicenceType = LTYPES[typeOf(l)]?.label || l.LicenceType || "";
  // company firearm: the owner / CEO's name and photo, and the company on its own line (CompanyLine) -
  // below the names on the hologram card, in place of the names on the legacy card
  if (typeOf(l) === "Company") Object.assign(d, { CompanyLine: co, Address: h.Address || "" });
  if (isLTC(l)) {                                       // the carrier's name and photo; the company's firearm
    const gun = lic(l.CarryForRef) || {};
    Object.assign(d, { Surname: l.CarrierSurname || "", GivenNames: firstNames({ GivenNames: l.CarrierGivenNames, MiddleName: l.CarrierMiddleName }),
      DateOfBirth: l.CarrierDOB || "", Sex: l.CarrierSex || "", Phone: l.CarrierPhone || "", Address: [co, l.CarrierAddress].filter(Boolean).join("\n"),
      SerialNo: gun.SerialNo || l.SerialNo || "", Make: gun.Make || l.Make || "", Model: gun.Model || l.Model || "", FirearmType: gun.FirearmType || l.FirearmType || "", Calibre: gun.Calibre || l.Calibre || "" });
  }
  return d;
}
const sortName = h => isCompany(h) ? String(h.CompanyName || "") : `${h.Surname || ""} ${h.GivenNames || ""}`;
/* A photo for a holder (list = holders) or for the carrier on a licence to carry (list = licences) */
async function queuePhoto(h, blob, withFace, list = LISTS.holders) {
  const now = new Date(), stamp = `${ymd(now).replace(/-/g, "")}-${hhmm(now).replace(":", "")}${String(now.getSeconds()).padStart(2, "0")}`;
  const localKey = `photo:local-${h.ClientRef}-${stamp}`, who = list === LISTS.licences ? carrierName(h) : fullName(h);
  await kvSet(localKey, blob);
  const fields = { PhotoDate: today() };
  mergeLocal(list, h.ClientRef, fields, { _localKey: localKey });
  await enqueue({ kind: "upsert", list, ref: h.ClientRef, fields, label: `Photo · ${who}`,
    file: { blob, localKey, type: "image/jpeg", path: `${h.ClientRef}/${stamp}.jpg` } });
  if (list === LISTS.licences) logActivity("Carrier photo taken", holder(h.HolderRef), h); else logActivity("Photo taken", h, null);
  if (withFace) {
    await enqueue({ kind: "face", list, ref: h.ClientRef, file: { blob }, label: `Face record · ${who}` });
    mergeLocal(list, h.ClientRef, { FaceStatus: "Waiting", FaceNote: "" });
  }
}
/* History. Entries from before "one licence per firearm" were recorded against the person's
   reference (now the holder's) and the licence number, so those are looked up too. */
async function loadHistory(field, ref, licNo) {
  const el = $("#hist");
  const wants = field === "HolderRef" ? [["HolderRef", ref], ["LicenceRef", ref]] : [["LicenceRef", ref], ...(licNo ? [["LicenceNo", licNo]] : [])];
  try {
    let rows = [];
    if (DEMO) rows = (await listItems(LISTS.activity)).filter(r => wants.some(([k, v]) => r[k] === v));
    else for (const [k, v] of wants) {
      let url = `/sites/${siteId}/lists/${LISTS.activity}/items?$filter=fields/${k} eq '${String(v).replace(/'/g, "''")}'&expand=fields&$top=200`;
      while (url) { const j = await graph(url, { headers: { Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" } }); rows.push(...j.value.map(i => i.fields)); url = j["@odata.nextLink"]; }
    }
    const seen = new Set(); rows = rows.filter(r => { const k = r.ClientRef || r.id; if (seen.has(k)) return false; seen.add(k); return true; });
    rows.sort((a, b) => String(b.ActivityAt).localeCompare(String(a.ActivityAt)));
    if (el && el.isConnected) el.innerHTML = rows.length ? `<ul class="plain">${rows.slice(0, 50).map(r => `<li><span class="mono">${esc(fmtDate(String(r.ActivityAt).slice(0, 10)) + " " + String(r.ActivityAt).slice(11))}</span><span><b>${esc(r.Title)}</b>${field === "HolderRef" && r.LicenceNo ? " · " + esc(r.LicenceNo) : ""} · ${esc(r.ActivityBy)}${r.Details ? ` <span class="muted">· ${esc(r.Details)}</span>` : ""}</span></li>`).join("")}</ul>` : "Nothing recorded yet.";
  } catch (e) { if (el && el.isConnected) el.textContent = isMissingList(e) ? `The ${LISTS.activity} list isn't set up.` : "History couldn't be loaded."; }
}

/* =====================================================================
   CONVERT records made before "one licence per firearm" (12 Nov 2026):
   the old licence row held the person; it becomes a holder with the SAME
   reference, so the photo and the face record stay attached. Its first
   firearm moves onto the licence; any further firearms become licences of
   their own, numbered "<old no>-2", "-3"... for the office to renumber.
   ===================================================================== */
async function convertOldRecords() {
  if (!canEdit()) return;
  // licence numbers now have a space after the letters (C23 -> C 23, LC108 -> LC 108)
  for (const x of D.licences.filter(x => /^(LC|C)\d/i.test(String(x.Title || "")))) {
    const no = withPfx(String(x.Title).match(/^(LC|C)/i)[1].toUpperCase(), cleanNo(x.Title));
    mergeLocal(LISTS.licences, x.ClientRef, { Title: no });
    await enqueue({ kind: "upsert", list: LISTS.licences, ref: x.ClientRef, fields: { Title: no }, label: `Licence no ${x.Title} → ${no}` });
  }
  // licences to carry were numbered LTC677; the prefix is now LC (LC677)
  for (const x of D.licences.filter(x => isLTC(x) && /^LTC/i.test(String(x.Title || "")))) {
    const no = withPfx("LC", cleanNo(x.Title));
    mergeLocal(LISTS.licences, x.ClientRef, { Title: no });
    await enqueue({ kind: "upsert", list: LISTS.licences, ref: x.ClientRef, fields: { Title: no }, label: `Licence no ${x.Title} → ${no}` });
  }
  // never convert twice: skip a person who already has a converted licence
  const old = D.licences.filter(l => !l.HolderRef && (l.Surname || l.GivenNames) && !D.licences.some(x => x !== l && x.HolderRef === l.ClientRef));
  for (const o of old) {
    const hf = {};
    ["Surname", "GivenNames", "MiddleName", "DateOfBirth", "Sex", "Address", "Phone", "Email", "PhotoUrl", "PhotoItemId", "PhotoDate",
     "FaceId", "FaceStatus", "FaceNote", "FaceDate", "CapturedBy"].forEach(k => { if (o[k] != null && o[k] !== "") hf[k] = o[k]; });
    hf.Title = fullName(hf);
    if (!holder(o.ClientRef)) {
      mergeLocal(LISTS.holders, o.ClientRef, hf);
      await enqueue({ kind: "upsert", list: LISTS.holders, ref: o.ClientRef, fields: hf, label: `Converted holder · ${hf.Title}` });
    }
    const guns = D.firearms.filter(g => g.LicenceRef === o.ClientRef && g.Removed !== "Yes");
    const g0 = guns[0] || {};
    const lf = { HolderRef: o.ClientRef, SerialNo: g0.Title || "", Make: g0.Make || "", Model: g0.Model || "", FirearmType: g0.FirearmType || "",
      Calibre: g0.Calibre || "", Purpose: g0.Purpose || "" };
    // the old row keeps its id; give the licence a new ClientRef so it can't clash with the holder's
    const newLicRef = newRef();
    const base = { Title: o.Title, LicenceType: o.LicenceType || "", LicenceStatus: o.LicenceStatus || "Active", IssueDate: o.IssueDate || "", ExpiryDate: o.ExpiryDate || "",
      Notes: o.Notes || "", CardBackground: o.CardBackground || "", CardOrientation: o.CardOrientation || "", LastPrinted: o.LastPrinted || "", PrintCount: o.PrintCount || 0, CapturedBy: o.CapturedBy || "" };
    D.licences = D.licences.filter(x => x !== o);
    // re-label the existing SharePoint row (found by its old ClientRef), then it carries the new ref
    mergeLocal(LISTS.licences, newLicRef, { ...base, ...lf });
    await enqueue({ kind: "upsert", list: LISTS.licences, ref: o.ClientRef, fields: { ...base, ...lf, ClientRef: newLicRef }, label: `Converted licence · ${o.Title}` });
    for (let i = 1; i < guns.length; i++) {
      const g = guns[i], r = newRef(), f = { ...base, Title: `${o.Title}-${i + 1}`, LastPrinted: "", PrintCount: 0, HolderRef: o.ClientRef, SerialNo: g.Title || "", Make: g.Make || "",
        Model: g.Model || "", FirearmType: g.FirearmType || "", Calibre: g.Calibre || "", Purpose: g.Purpose || "", Notes: "Converted from licence " + o.Title + " - give this licence its own number" };
      mergeLocal(LISTS.licences, r, f);
      await enqueue({ kind: "upsert", list: LISTS.licences, ref: r, fields: f, label: `Converted licence · ${f.Title}` });
    }
  }
  if (old.length) toast(`${old.length} older record${old.length === 1 ? "" : "s"} converted to holder + licence`);
  await repairConverted();
}
/* A converted licence whose firearm details didn't arrive: fill the empty ones from the old
   firearms list (the old firearm rows point at the holder's reference). Only empty fields. */
async function repairConverted() {
  let n = 0;
  for (const l of D.licences) {
    if (!l.HolderRef || l.SerialNo) continue;
    const used = new Set(D.licences.filter(x => x.HolderRef === l.HolderRef && x.SerialNo).map(x => norm(x.SerialNo)));
    const g = D.firearms.find(f => f.LicenceRef === l.HolderRef && f.Removed !== "Yes" && !used.has(norm(f.Title)));
    if (!g) continue;
    const f = {};
    [["SerialNo", g.Title], ["Make", g.Make], ["Model", g.Model], ["FirearmType", g.FirearmType], ["Calibre", g.Calibre], ["Purpose", g.Purpose]]
      .forEach(([k, v]) => { if (v && !l[k]) f[k] = v; });
    if (!Object.keys(f).length) continue;
    mergeLocal(LISTS.licences, l.ClientRef, f);
    await enqueue({ kind: "upsert", list: LISTS.licences, ref: l.ClientRef, fields: f, label: `Firearm details restored · ${l.Title}` });
    n++;
  }
  if (n) toast(`Firearm details restored on ${n} licence${n === 1 ? "" : "s"}`);
}

function trimNote(w, h, orientation) {
  const s = ZDCard.SIZE[orientation === "Portrait" ? "Portrait" : "Landscape"];
  const c = ZDCard.coverRect(w, h, s.w, s.h);
  const sideMm = (w - c.sw) / w * (orientation === "Portrait" ? 54 : 85.6), topMm = (h - c.sh) / h * (orientation === "Portrait" ? 85.6 : 54);
  const low = Math.min(w / s.w, h / s.h) < 0.75 ? " - low resolution, may print soft" : "";
  if (sideMm < 0.3 && topMm < 0.3) return "fits the card exactly" + low;
  return (sideMm >= topMm ? `about ${(sideMm / 2).toFixed(1)} mm trimmed from each side` : `about ${(topMm / 2).toFixed(1)} mm trimmed from top and bottom`) + low;
}

        <label>Print the card heading<select name="ShowHeader">${o(["Yes", "No"], b?.ShowHeader || "Yes")}</select></label>
        <label>Offer it on licences<select name="Active">${o(["Yes", "No"], b?.Active || "Yes")}</select></label>
        <label>Shaded panel behind the text<select name="TextPanel">${o(["No", "Yes"], b?.TextPanel || "No")}</select></label>
        <label>Field layout<select name="Layout">${o(["Standard", ...Object.keys(ZDCard.LAYOUTS)], b?.Layout || "Standard")}</select></label>

      <p class="small muted"><b>Field layout</b>: "Standard" places a heading, photo and labelled fields; a named layout puts only the values against the labels already on that card design.
        <b>Preprinted</b> "Yes": the picture is shown on screen to check the line-up but is <b>not printed</b> - the blank cards already carry it.</p>
      <p class="small muted">Choose "No" for the heading when the picture already has the title printed on it. Use the shaded panel when the picture is busy and the text is hard to read.</p>`,

    } });
}

    LicenceRef: lic ? lic.ClientRef : "", LicenceNo: lic ? lic.Title : "" };
}

function wireDocs(h, l) {
  const card = $("#docsCard"); if (!card) return;
  $$("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); openDoc((D.docs || []).find(d => d.ClientRef === a.dataset.open)); });
  $$("[data-dedit]").forEach(b => b.onclick = () => editDoc(h, (D.docs || []).find(d => d.ClientRef === b.dataset.dedit)));
  $$("[data-ddel]").forEach(b => b.onclick = () => deleteDoc(h, (D.docs || []).find(d => d.ClientRef === b.dataset.ddel)));
  if (!canEdit() || !$("#docDrop")) return;
  const add = files => attachDocs(h, l, [...files]);
  const input = $("#docFile");
  $("#docUp").onclick = () => input.click();
  input.onchange = () => { if (input.files.length) add(input.files); input.value = ""; };
  // the whole card takes a drop; the dashed box shows where
  const zone = $("#docDrop"); let depth = 0;
  card.ondragenter = e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; zone.classList.add("over"); };
  card.ondragover = e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } };
  card.ondragleave = () => { if (--depth <= 0) { depth = 0; zone.classList.remove("over"); } };
  card.ondrop = e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; zone.classList.remove("over"); if (e.dataTransfer.files.length) add(e.dataTransfer.files); };
  S.paste = add;                                       // Ctrl+V of a file or screenshot on this page
}
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
// A file dropped anywhere else must not make the browser leave the app to show it
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", e => { if (hasFiles(e)) { e.preventDefault(); if (S.paste) toast("Drop documents onto the Documents box"); } });
document.addEventListener("paste", e => {
  if (!S.paste || $("#dlg").open || $("#ask").open) return;
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;                          // ordinary text paste into a field
  e.preventDefault();
  const stamp = `${today()} ${hhmm(new Date()).replace(":", "")}`;
  // a pasted screenshot arrives as "image.png" - give it a useful name
  S.paste(files.map((f, i) => /^image\.\w+$/i.test(f.name) ? new File([f], `Pasted ${stamp}${files.length > 1 ? " " + (i + 1) : ""}.${f.name.split(".").pop()}`, { type: f.type }) : f));
});

function attachDocs(h, l, files) {
  const big = files.filter(f => f.size > DOC_MAX_MB * 1024 * 1024), ok = files.filter(f => f.size <= DOC_MAX_MB * 1024 * 1024 && f.size > 0);
  if (big.length) toast(`Too large (over ${DOC_MAX_MB} MB): ${big.map(f => f.name).join(", ")}`);
  if (!ok.length) return;
  openDialog({ title: `Attach ${ok.length} document${ok.length === 1 ? "" : "s"}`, save: "Attach",
    body: `<ul class="plain small" style="margin:0 0 12px">${ok.map(f => `<li><b>${esc(f.name)}</b><span class="grow"></span><span class="muted">${fileSize(f.size)}</span></li>`).join("")}</ul>
      <div class="grid2"><label>Document type *<select name="DocType">${docTypeOptions("")}</select></label>
        <label>Attach to<select name="LicenceRef">${attachToOptions(h, l?.ClientRef || "")}</select></label></div>
      <div class="grid2"><label>Date on the document<input type="date" name="DocDate"></label><span></span></div>
      <label>Description${ok.length > 1 ? " (used for all of them)" : ""}<input type="text" name="Description" maxlength="250"></label>`,
    onSubmit: async f => {
      if (!f.DocType) { toast("Choose the document type"); return false; }
      const fields = docFields(h, f), lic = fields.LicenceRef ? lic_(fields.LicenceRef) : null;
      const folder = `${safeName(fullName(h))} (${String(h.ClientRef).slice(0, 6)})`;
      for (const file of ok) {
        const ref = newRef(), dot = file.name.lastIndexOf(".");
        const stem = dot > 0 ? file.name.slice(0, dot) : file.name, ext = dot > 0 ? file.name.slice(dot).replace(/[^.\w]/g, "") : "";
        const fl = { ...fields, OriginalName: file.name, UploadedBy: me(), UploadedAt: `${today()} ${hhmm(new Date())}` };
        mergeLocal(LISTS.docs, ref, fl, { name: file.name, size: file.size });
        await enqueue({ kind: "doc", list: LISTS.docs, ref, fields: fl, label: `Document · ${f.DocType} · ${file.name}`,
          file: { blob: file, name: file.name, type: file.type || "application/octet-stream", path: `${folder}/${safeName(stem)} (${ref.slice(0, 6)})${ext}` } });
        logActivity("Document attached", h, lic, `${f.DocType}: ${file.name}`);
      }
      toast(`${ok.length} document${ok.length === 1 ? "" : "s"} attached`); route(true);
    } });
}
const lic_ = ref => D.licences.find(x => x.ClientRef === ref) || null;

async function openDoc(d) {
  if (!d) return;
  const w = window.open("", "_blank");               // opened now, while the click still counts, so it isn't blocked
  try {
    let url = !DEMO && d.webUrl && !d._pending ? d.webUrl : "";
    if (!url) {
      const op = (await qMine()).find(o => o.kind === "doc" && o.ref === d.ClientRef && o.file?.blob);
      const blob = op ? op.file.blob : d.fileId ? await downloadFile(LISTS.docs, d.fileId) : null;
      if (!blob) throw new Error(online() ? "The file couldn't be found" : "Documents open when you're online");
      url = URL.createObjectURL(blob); setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    if (w) w.location = url; else location.href = url;
  } catch (e) { w?.close(); toast(isNetErr(e) ? "Documents open when you're online" : e.message); }
}

function editDoc(h, d) {
  if (!d) return;
  openDialog({ title: "Document details",
    body: `<p class="small" style="margin-top:0"><b>${esc(d.OriginalName || d.name || "")}</b></p>
      <div class="grid2"><label>Document type *<select name="DocType">${docTypeOptions(d.DocType || "")}</select></label>
        <label>Attach to<select name="LicenceRef">${attachToOptions(h, d.LicenceRef || "")}</select></label></div>
      <div class="grid2"><label>Date on the document<input type="date" name="DocDate" value="${esc(String(d.DocDate || "").slice(0, 10))}"></label><span></span></div>
      <label>Description<input type="text" name="Description" maxlength="250" value="${esc(d.DocDescription || "")}"></label>`,
    onSubmit: async f => {
      if (!f.DocType) { toast("Choose the document type"); return false; }
      const fields = docFields(h, f);
      mergeLocal(LISTS.docs, d.ClientRef, fields);
      // still waiting to upload? change the waiting upload instead of adding a second change
      const op = (await qMine()).find(o => o.kind === "doc" && o.ref === d.ClientRef && o.file?.blob);
      if (op) { op.fields = { ...op.fields, ...fields }; op.error = ""; await qPut(op); await qCount(); flushSoon(300); }
      else await enqueue({ kind: "doc", list: LISTS.docs, ref: d.ClientRef, fields, label: `Document details · ${d.OriginalName || d.name}` });
      route(true);
    } });
}

async function deleteDoc(h, d) {
  if (!d) return;
  const queued = (await qMine()).filter(o => o.kind === "doc" && o.ref === d.ClientRef);
  const notSent = String(d.id || "").startsWith("local-");
  if (!notSent && !online()) return toast("Deleting needs an internet connection");
  if (!await ask(`Delete ${d.OriginalName || d.name}?\n\n${notSent ? "It hasn't been sent to SharePoint yet, so it will simply be dropped." : "It is removed from SharePoint for good."}`, { title: "Delete document", yes: "Delete", danger: true })) return;
  try {
    if (!notSent) await deleteItem(LISTS.docs, d.id);
    for (const op of queued) await qDel(op.qid);
    await qCount();
    D.docs = D.docs.filter(x => x.ClientRef !== d.ClientRef); saveSnapshot();
    if (!notSent) logActivity("Document deleted", h, d.LicenceRef ? lic_(d.LicenceRef) : null, `${d.DocType || ""}: ${d.OriginalName || d.name}`);
    toast("Document deleted"); route(true);
  } catch (e) { toast(isForbidden(e) ? "SharePoint refused this (no permission)" : e.message); }
}

/* =====================================================================
   REPORTS - activity log for a date range, one holder with all their
   licences, and overdue (expired, not renewed) licences. Each can be
   printed or downloaded for Excel.
   ===================================================================== */
function downloadCsv(name, head, rows) {
  const q = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const text = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");   // the BOM makes Excel read it as UTF-8
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const REPORTS = [["activity", "Activity log"], ["holder", "Licence holder"], ["overdue", "Overdue licences"]];
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const whenText = at => `${fmtDate(String(at || "").slice(0, 10))} ${String(at || "").slice(11, 16)}`;

}

/* ---- Activity log for a date range (default today) ---- */
async function activityBetween(from, to) {
  const hi = to + " 99";                                  // ActivityAt is "YYYY-MM-DD HH:MM"
  if (DEMO) return (await listItems(LISTS.activity)).filter(r => String(r.ActivityAt || "") >= from && String(r.ActivityAt || "") <= hi);
  const rows = [];
  let url = `/sites/${siteId}/lists/${LISTS.activity}/items?$filter=fields/ActivityAt ge '${from}' and fields/ActivityAt le '${hi}'&expand=fields&$top=500`;
  while (url) { const j = await graph(url, { headers: { Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" } }); rows.push(...j.value.map(i => i.fields)); url = j["@odata.nextLink"]; }
  return rows;
}

      + (list.length ? `<table><thead><tr><th>When</th><th>Action</th><th>Holder</th><th>Licence</th><th>By</th><th>Details</th></tr></thead><tbody>
        ${list.map(r => `<tr><td class="nowrap mono small">${esc(whenText(r.ActivityAt))}</td><td><b>${esc(r.Title)}</b></td>

        : `<p class="muted">Nothing recorded${q ? " matching the filter" : ""} in this period.</p>`);

function codeDialog(set, c) {

    body: `<div class="grid2"><label>${free ? "Document type" : "Code"} *<input type="text" name="Title" maxlength="${free ? 60 : 12}" value="${esc(c?.Title || "")}" ${free ? "" : `style="text-transform:uppercase"`}></label>

    } });
}

      const ref = s?.ClientRef || newRef();
      mergeLocal(LISTS.staff, ref, f);
      await enqueue({ kind: "upsert", list: LISTS.staff, ref, fields: f, label: `Staff · ${f.Title}` });
      if (S.roleSource === "setup" && f.Email === me() && f.HubRole === "Admin") S.roleSource = "staff";
      pageStaff();
    } });
}

/* =====================================================================
   SETTINGS - card printer adjustment (per computer), offline, demo
   ===================================================================== */
const PRINT_KEY = () => storeKey("zd-print");
function printSettings() { try { return Object.assign({ bleedMm: 0.5, offsetXmm: 0, offsetYmm: 0 }, JSON.parse(localStorage.getItem(PRINT_KEY()) || "{}")); } catch { return { bleedMm: 0.5, offsetXmm: 0, offsetYmm: 0 }; } }
function pageSettings() {
  const p = printSettings(), passAt = facePass()?.at;
  $("#main").innerHTML = banners() + `<div class="bar"><h2>Settings</h2></div>
    <div class="card"><h3>Card printer (this computer only)</h3>
      <p class="small muted">In the print window choose the card printer, set <b>Margins: None</b> and <b>Scale: 100%</b> (or "Actual size"), and turn off headers and footers. If the picture still sits off-centre on the card, nudge it here, print the test card, and repeat.</p>
      <div class="grid3" id="pf">
        <label>Bleed - extra beyond each edge (mm)<input type="number" step="0.1" min="0" max="3" name="bleedMm" value="${p.bleedMm}"></label>
        <label>Move right (mm, minus = left)<input type="number" step="0.1" min="-5" max="5" name="offsetXmm" value="${p.offsetXmm}"></label>
        <label>Move down (mm, minus = up)<input type="number" step="0.1" min="-5" max="5" name="offsetYmm" value="${p.offsetYmm}"></label></div>
      <label class="chk"><input type="checkbox" id="rotBack" ${p.rotateBack ? "checked" : ""}> Turn the back of two-sided cards upside down (tick this if the back comes out upside down)</label>
      <button class="btn" id="saveP">Save</button> <button class="btn" id="testP">Print test card</button>
      <canvas id="testCv" class="cardview" style="margin-top:14px"></canvas></div>
    <div class="card"><h3>Face check and offline work</h3>
      <p class="small">Last face check on this device: <b>${passAt ? esc(localStamp(new Date(passAt).toISOString())) : "none"}</b>. A new one is asked for every new browser session and after ${RULES.FACE_RECHECK_HOURS} hours.
        With no internet, this device can keep working for ${RULES.OFFLINE_GRACE_HOURS} hours after a face check.</p>
      <p class="small">Copy of the register on this device: <b>${D.at ? esc(localStamp(D.at)) : "none"}</b> · changes waiting to send: <b>${SYNC.waiting}</b></p>
      <button class="btn" id="recheck">Do a face check now</button>
      ${DEMO ? ` <label class="chk" style="margin-top:12px"><input type="checkbox" id="fakeOff" ${FORCE_OFFLINE ? "checked" : ""}> Pretend to be offline (demo testing)</label>` : ""}</div>`;
  drawTestCard($("#testCv"));
  const read = () => ({ ...Object.fromEntries($$("#pf input").map(i => [i.name, Math.round((+i.value || 0) * 10) / 10])), rotateBack: $("#rotBack").checked });
  $("#saveP").onclick = () => { localStorage.setItem(PRINT_KEY(), JSON.stringify(read())); toast("Saved for this computer"); };
  $("#testP").onclick = () => ZDCard.printCard($("#testCv"), read());
  $("#recheck").onclick = () => { clearFacePass(); location.reload(); };
  const fo = $("#fakeOff");
  if (fo) fo.onchange = () => { FORCE_OFFLINE = fo.checked; sessionStorage.setItem("zd-fake-offline", fo.checked ? "1" : ""); renderWho(); if (!fo.checked) flushSoon(200); route(true); };
}
/* Test card: lines 1, 2 and 3 mm in from every edge, a centre cross and arrows - shows which way to nudge */
function drawTestCard(cv) {
  const { w, h } = ZDCard.SIZE.Landscape, mm = ZDCard.MM; cv.width = w; cv.height = h;
  const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  [1, 2, 3].forEach((d, i) => { g.strokeStyle = ["#d00", "#06c", "#090"][i]; g.lineWidth = 3; g.strokeRect(d * mm, d * mm, w - 2 * d * mm, h - 2 * d * mm); });
  g.strokeStyle = "#000"; g.lineWidth = 2; g.beginPath(); g.moveTo(w / 2 - 40, h / 2); g.lineTo(w / 2 + 40, h / 2); g.moveTo(w / 2, h / 2 - 40); g.lineTo(w / 2, h / 2 + 40); g.stroke();
  g.fillStyle = "#000"; g.font = "700 30px Segoe UI, Arial"; g.textAlign = "center";
  g.fillText("TOP", w / 2, 80); g.fillText("BOTTOM", w / 2, h - 60); g.save(); g.translate(70, h / 2); g.rotate(-Math.PI / 2); g.fillText("LEFT", 0, 0); g.restore();
  g.save(); g.translate(w - 60, h / 2); g.rotate(Math.PI / 2); g.fillText("RIGHT", 0, 0); g.restore();
  g.font = "500 22px Segoe UI, Arial"; g.fillText("Red 1 mm · Blue 2 mm · Green 3 mm from the edge", w / 2, h / 2 + 90);
  g.fillText("All three should show evenly on every side", w / 2, h / 2 + 122);
}
if (DEMO && sessionStorage.getItem("zd-fake-offline")) FORCE_OFFLINE = true;

/* ---------------- dialog + sync panel ---------------- */
function openDialog({ title, body, save = "Save", extra = "", onSubmit }) {
  const dlg = $("#dlg"), form = $("#dlgForm");
  $("#dlgT").textContent = title; $("#dlgB").innerHTML = body; $("#dlgOk").textContent = save; $("#dlgOk").hidden = !save;
  const foot = form.querySelector(".df"); foot.querySelectorAll(".extra").forEach(x => x.remove());
  if (extra) { const s = document.createElement("span"); s.className = "extra"; s.style.marginRight = "auto"; s.innerHTML = extra; foot.prepend(s); }
  $("#dlgX").onclick = () => dlg.close();
  form.onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries([...new FormData(form)].map(([k, v]) => [k, String(v).trim()]));
    $("#dlgOk").disabled = true;
    try { const r = await onSubmit?.(f); if (r !== false) dlg.close(); } finally { $("#dlgOk").disabled = false; }
  };
  dlg.showModal();
}
/* The app's own yes/no question, in place of the browser's confirm() box (which
   showed "marcusappdev.github.io says"). Resolves true for yes, false for no / Esc. */
function ask(message, { title = "Please confirm", yes = "OK", no = "Cancel", danger = false } = {}) {
  return new Promise(resolve => {
    const dlg = $("#ask");
    $("#askT").textContent = title; $("#askB").textContent = message;
    const y = $("#askYes"), n = $("#askNo");
    y.textContent = yes; n.textContent = no;
    y.style.background = danger ? "var(--bad)" : ""; y.style.borderColor = danger ? "var(--bad)" : "";
    let answer = false;
    y.onclick = () => { answer = true; dlg.close(); };
    n.onclick = () => dlg.close();
    dlg.onclose = () => resolve(answer);
    dlg.showModal(); (danger ? n : y).focus();   // Enter never deletes by accident
  });
}
async function openSyncPanel() {
  const ops = await qMine();
  openDialog({ title: ops.length ? `${ops.length} change${ops.length === 1 ? "" : "s"} waiting to send` : "Everything has been sent", save: ops.length ? "Send now" : "",
    body: (ops.length ? `<ul class="plain">${ops.map(o => `<li><span class="grow"><b>${esc(o.label)}</b><br><span class="small muted">${esc(localStamp(o.created))}${o.tries ? ` · ${o.tries} tr${o.tries === 1 ? "y" : "ies"}` : ""}</span>${o.error ? `<br><span class="small" style="color:var(--bad)">${esc(o.error)}</span>` : ""}</span>
        <button type="button" class="btn sm danger" data-qdrop="${o.qid}">Discard</button></li>`).join("")}</ul>` : `<p class="muted">Nothing is waiting on this device.</p>`)
      + `<p class="small muted">${online() ? "Changes are sent automatically while there's a connection." : "This device is offline. Changes will be sent automatically when the connection is back."} Nothing is lost if you close the app.</p>`,
    onSubmit: async () => { await flushQueue(); if (SYNC.waiting) toast(online() ? "Some changes couldn't be sent - open this panel to see why" : "Still offline - they'll be sent when you're connected"); } });
  $$("[data-qdrop]").forEach(b => b.onclick = async () => {
    if (!await ask("Discard this change? It hasn't reached SharePoint and will be lost.", { title: "Discard change", yes: "Discard", danger: true })) return;
    await qDel(+b.dataset.qdrop); await qCount(); $("#dlg").close(); await loadData(); route(true); openSyncPanel();
  });
}
</script>
